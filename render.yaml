# ============================================
# MaurEdge 3.1 — Render Deployment Config
# (Next.js Dashboard + Cron-Triggered Trading Engine)
#
# Architecture:
#   - Web Service: Next.js dashboard + all API routes
#   - Cronjobs.com: Pings /api/cron/cycle every 60s
#   - Supabase: PostgreSQL database
# ============================================

services:
  # Dashboard + API + Trading Engine — Next.js App
  - type: web
    name: mauredge-dashboard
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: WALLET_ADDRESS
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: AI_MODEL
        value: gpt-4o
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: FIREWORKS_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: OPENCODE_API_KEY
        sync: false
      - key: OPENCODE_ENDPOINT
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: CRONJOB_API_KEY
        sync: false
